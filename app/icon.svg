<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rack : 3 unités serveur, LED verte = en ligne (même vert que la variable success du dashboard) -->
  <style>.u{fill:#18181b}@media (prefers-color-scheme:dark){.u{fill:#e4e4e7}}</style>
  <defs>
    <mask id="led">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="23" cy="8" r="1.7" fill="#000"/>
      <circle cx="23" cy="16" r="1.7" fill="#000"/>
      <circle cx="23" cy="24" r="1.7" fill="#000"/>
    </mask>
  </defs>
  <g class="u" mask="url(#led)">
    <rect x="4" y="5" width="24" height="6" rx="2"/>
    <rect x="4" y="13" width="24" height="6" rx="2"/>
    <rect x="4" y="21" width="24" height="6" rx="2"/>
  </g>
  <circle cx="23" cy="8" r="1.7" fill="#34d399"/>
</svg>
