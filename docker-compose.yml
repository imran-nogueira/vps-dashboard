services:
  dashboard:
    build: .
    ports:
      # Bound to loopback only: reach it at http://localhost:3000.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/vps-dashboard.db
    volumes:
      - ./data:/app/data
    depends_on:
      - agent-tunnel
    restart: unless-stopped

  # Maintains a permanent SSH tunnel to the VPS agent instead of relying on
  # the agent's port being reachable over the public internet. The dashboard
  # reaches it at http://agent-tunnel:9090 via Docker's internal network.
  # Uses a dedicated, single-purpose SSH key (never your personal key) that
  # the VPS restricts to exactly this one port-forward — see README.
  agent-tunnel:
    build: ./tunnel
    environment:
      - TUNNEL_HOST=${TUNNEL_HOST}
      - TUNNEL_USER=${TUNNEL_USER:-tunnel}
      - TUNNEL_REMOTE_PORT=${TUNNEL_REMOTE_PORT:-9090}
      - TUNNEL_LOCAL_PORT=${TUNNEL_LOCAL_PORT:-9090}
    volumes:
      - ${TUNNEL_SSH_KEY}:/run/secrets/tunnel_key_ro:ro
    restart: unless-stopped
