services:
  dashboard:
    build: .
    ports:
      # Bound to loopback only: reach it at http://localhost:3000.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/vps-dashboard.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
